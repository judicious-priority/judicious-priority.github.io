<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockets Archive</title>
    <!-- Styling for a clean interface -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        #search-box { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        li:hover { background-color: #f9f9f9; }
        li.hidden { display: none; }
        .pdf-icon { margin-right: 12px; font-size: 20px; color: #d9383a; }
        a { color: #0969da; text-decoration: none; font-size: 17px; font-weight: 500; flex-grow: 1; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Available Dockets</h1>
    
    <!-- Real-time search bar -->
    <input type="text" id="search-box" placeholder="Search dockets by name..." onkeyup="filterFiles()">

    <ul id="file-list">Loading files...</ul>

    <!-- Zero-API script that reads your deployed files directly -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // Configures the script to look directly at your hosted directory
        repoGalleria({
            target: '#file-list',
            branch: 'main', // Change to 'master' if your default branch uses the old naming scheme
            extensions: ['pdf'] // Explicitly looks for PDF documents
        });

        // Formats the links dynamically and adds a clean PDF icon
        document.addEventListener('DOMContentLoaded', () => {
            const observer = new MutationObserver(() => {
                const listItems = document.querySelectorAll('#file-list li');
                listItems.forEach(item => {
                    if (!item.querySelector('.pdf-icon')) {
                        const icon = document.createElement('span');
                        icon.className = 'pdf-icon';
                        icon.innerHTML = '📄'; 
                        item.insertBefore(icon, item.firstChild);
                        
                        // Forces the link to open in a new browser tab safely
                        const link = item.querySelector('a');
                        if (link) link.target = '_blank';
                    }
                });
            });
            observer.observe(document.getElementById('file-list'), { childList: true });
        });

        // Real-time text filter function
        function filterFiles() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const listItems = document.querySelectorAll('#file-list li');
            
            listItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.classList.toggle('hidden', !text.includes(query));
            });
        }
    </script>

</body>
</html>
