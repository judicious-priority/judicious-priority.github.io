<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockets Archive</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        #search-box { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        li:hover { background-color: #f9f9f9; }
        li.hidden { display: none; }
        .pdf-icon { margin-right: 12px; font-size: 20px; color: #d9383a; }
        a { color: #0969da; text-decoration: none; font-size: 17px; font-weight: 500; flex-grow: 1; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Available Dockets</h1>
    
    <input type="text" id="search-box" placeholder="Search dockets by name..." onkeyup="filterFiles()">

    <ul id="file-list">Loading files...</ul>

    <script>
        async function loadFilesDirectly() {
            const listElement = document.getElementById('file-list');
            try {
                // Fetches the raw HTML content of the directory directly from your site hosting
                const response = await fetch('./');
                const text = await response.text();
                
                // Parse the text to look for links
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                const links = doc.querySelectorAll('a');
                
                listElement.innerHTML = '';
                let fileCount = 0;

                links.forEach(link => {
                    const href = link.getAttribute('href');
                    
                    // Filter to only display files ending in .pdf
                    if (href && href.toLowerCase().endsWith('.pdf')) {
                        fileCount++;
                        const li = document.createElement('li');
                        
                        const icon = document.createElement('span');
                        icon.className = 'pdf-icon';
                        icon.innerHTML = '📄';

                        const a = document.createElement('a');
                        a.href = href;
                        // Cleans up the displayed name (replaces %20 back to spaces)
                        a.textContent = decodeURIComponent(href);
                        a.target = "_blank";

                        li.appendChild(icon);
                        li.appendChild(a);
                        listElement.appendChild(li);
                    }
                });

                if (fileCount === 0) {
                    listElement.textContent = "No PDF documents found in this folder.";
                }
            } catch (error) {
                listElement.textContent = "Failed to load directory. Please verify that files are uploaded.";
                console.error(error);
            }
        }

        function filterFiles() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const listItems = document.querySelectorAll('#file-list li');
            
            listItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.classList.toggle('hidden', !text.includes(query));
            });
        }

        loadFilesDirectly();
    </script>

</body>
</html>
