---
permalink: /dockets/
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dockets Archive</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; color: #333; }
        h1 { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
        #search-box { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-bottom: 20px; }
        ul { list-style-type: none; padding: 0; margin: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        li:hover { background-color: #f9f9f9; }
        li.hidden { display: none; }
        .pdf-icon { margin-right: 12px; font-size: 20px; color: #d9383a; }
        a { color: #0969da; text-decoration: none; font-size: 17px; font-weight: 500; flex-grow: 1; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <h1>Documents in Dockets</h1>
    
    <input type="text" id="search-box" placeholder="Search by date / time / dactket# / part / doc   ..." onkeyup="filterFiles()">

    <ul id="file-list">
        {% for file in site.static_files %}
            {% if file.path contains '/dockets/' %}
                {% unless file.path contains 'index.html' %}
                    <li>
                        <span class="pdf-icon">📄</span>
                        <a href="{{ site.baseurl }}{{ file.path }}" target="_blank">{{ file.name }}</a>
                    </li>
                {% endunless %}
            {% endif %}
        {% endfor %}
    </ul>

    <script>
        function filterFiles() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const listItems = document.querySelectorAll('#file-list li');
            
            listItems.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.classList.toggle('hidden', !text.includes(query));
            });
        }
    </script>

</body>
</html>
